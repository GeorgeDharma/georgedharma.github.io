name: Move the study sites to their standalone addresses
on:
  push:
    branches: [main]
    paths: ['.github/workflows/move-study-sites.yml']
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Preserve the old links after the verified course transfer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          from html import escape
          from pathlib import Path
          from subprocess import check_output
          from urllib.parse import quote

          courses = {
              "french-study": ("frenchwithgeorge", "French with George", "432ef0b8adf1432ef107038f68a5c77fab4d3d43"),
              "finance-study": ("financewithgeorge", "Finance with George", "bd5650233818d6bdc6c59b35d5a75f7dd7a76adb"),
          }


          def moved_page(title, url):
              target = escape(url, quote=True)
              return f"""<!doctype html>
          <html lang="en"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="noindex,nofollow,noarchive">
          <title>{title} has moved</title>
          <link rel="canonical" href="{target}">
          <script>
          const destination = new URL(document.querySelector('link[rel="canonical"]').href);
          destination.search = window.location.search;
          destination.hash = window.location.hash;
          window.location.replace(destination.href);
          </script>
          <noscript><meta http-equiv="refresh" content="0;url={target}"></noscript>
          </head><body><p>This study page has moved. <a href="{target}">Open {title}</a>.</p></body></html>
          """


          for old, (_, _, previous_tree) in courses.items():
              actual = check_output(["git", "rev-parse", f"HEAD:{old}"], text=True).strip()
              if actual != previous_tree:
                  raise SystemExit(f"{old} has changed since it was copied. Leave the current site in place and reconcile it first.")

          for old, (new, title, _) in courses.items():
              root = Path(old)
              for path in sorted(root.rglob("*"), key=lambda p: len(p.parts), reverse=True):
                  if path.is_dir():
                      if not any(path.iterdir()):
                          path.rmdir()
                      continue
                  if path.name == "index.html":
                      directory = path.parent.relative_to(root).as_posix()
                      suffix = "" if directory == "." else quote(directory, safe="/") + "/"
                      path.write_text(moved_page(title, f"https://georgedharma.github.io/{new}/{suffix}"), encoding="utf-8")
                  elif path.suffix not in {".pdf", ".xlsx"}:
                      path.unlink()
          PYTHON
          git add -- french-study finance-study
          tree=$(git write-tree)
          test "$(git rev-parse "$tree:french-study")" = '94db3cd8cf8ea7994e44de440873eebc73875cf7'
          test "$(git rev-parse "$tree:finance-study")" = '76feabfc272fb413fe425a6e1c43a677b130bdac'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Forward old study bookmarks to the standalone course sites'
          git push origin HEAD:refs/heads/main
